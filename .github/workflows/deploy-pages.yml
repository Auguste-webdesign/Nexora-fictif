# Deploys the static-export build (scripts/build-static.mjs) to GitHub Pages.
#
# Adapted from Next.js's own reference template
# (https://github.com/nextjs/deploy-github-pages) — npm instead of pnpm, to
# match this repo's package-lock.json, and `npm run build:static` instead of
# a plain build, since the API route and the order confirmation page have to
# be excluded before `next build` runs (see that script's own comments for
# why — both are genuinely incompatible with static hosting, not just
# skipped for convenience).
#
# `actions/configure-pages` reads this repo's Pages settings and outputs
# `base_path` — for a project site (github.io/Nexora-fictif) that resolves to
# `/Nexora-fictif` automatically, so it survives a repo rename without a code
# change. That value becomes NEXT_PUBLIC_PAGES_BASE_PATH, which next.config.ts
# and src/lib/base-path.ts both read.
#
# One-time setup this workflow depends on and cannot do itself: in the repo's
# Settings → Pages, "Source" must be set to "GitHub Actions" (not "Deploy
# from a branch") — see the deployment notes handed back after this file.

name: Déployer Nexora sur GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v5

      - name: Build (static export)
        run: npm run build:static
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          NEXT_PUBLIC_PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
